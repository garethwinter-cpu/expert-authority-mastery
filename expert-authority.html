<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expert &amp; Authority Mastery · Curriculum</title>
<meta name="description" content="The Expert & Authority Mastery curriculum, read from Airtable every time the page loads.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#7A12D4;--brand-light:#F6EEFD;--green:#159F65;--orange:#ED6325;--pink:#DF1A6F;--gold:#946A00;--gold-light:#FBF3DE;--ink:#0F131A;--text:#0F131A;--muted:#595E67;--subtle:#71767F;--border:#DFE1E5;--shadow:0 4px 15px 0 rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Google Sans","Segoe UI",system-ui,sans-serif;background:#fff;color:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.top{height:56px;display:flex;align-items:center;border-bottom:1px solid var(--border)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;width:100%;gap:16px}
.wm{font-weight:700;font-size:17px;white-space:nowrap} .wm span{color:var(--brand)} .top .meta{font-size:13px;color:var(--subtle);text-align:right}
.top .meta a{color:var(--brand);text-decoration:none;font-weight:600}
.hero{padding:44px 0 20px}
h1{font-size:clamp(32px,4.5vw,48px);font-weight:700;line-height:1.1;letter-spacing:-.02em}
.hero p{margin-top:12px;font-size:18px;color:var(--muted);max-width:760px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.fact{border:1px solid var(--border);border-radius:128px;padding:8px 16px;font-size:14px;font-weight:600} .fact b{color:var(--brand)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0 4px;font-size:13px;color:var(--subtle)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tz{margin-top:14px;font-size:13px;color:var(--subtle)} .tz b{color:var(--text);font-weight:600}
.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 10px;padding-left:14px;border-left:4px solid var(--c)}
.sec-w{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c)} .sec-n{font-size:15px;color:var(--muted)}
.wk{display:grid;grid-template-columns:64px 1.25fr 1fr;gap:18px;padding:18px 20px 18px 0;border:1px solid var(--border);border-left:6px solid var(--c);border-radius:16px;background:#fff;margin-bottom:12px;box-shadow:var(--shadow)}
.wk.single{grid-template-columns:64px 1fr}
.num{display:flex;justify-content:center;padding-top:2px}
.num span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:0 8px;height:44px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:13px;text-align:center;line-height:1.1}
.k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center} .k b{color:var(--c)}
.k .badge{font-size:10px;padding:2px 8px;border-radius:128px;background:var(--c);color:#fff;letter-spacing:.06em}
.col h3{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:6px;text-wrap:balance}
.col p{font-size:14.5px;color:var(--muted)}
.cover{width:100%;max-width:240px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin:10px 0 2px;display:block;background:#f4f4f6}
.when{font-size:13.5px;color:var(--text);font-weight:600;margin-bottom:4px} .when span{color:var(--subtle);font-weight:400}
.lead{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:600}
.faces{display:flex} .faces img,.faces i{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid #fff;box-shadow:var(--shadow);display:inline-block;background:var(--c)} .faces img+img,.faces i+img,.faces img+i{margin-left:-9px}
details{margin-top:8px} summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand);list-style:none} summary::-webkit-details-marker{display:none} summary::after{content:" +"} details[open] summary::after{content:" −"}
.desc{margin-top:8px;font-size:13.5px;color:var(--muted);display:grid;gap:6px} .desc ul{margin-left:18px;display:grid;gap:3px} .desc strong{color:var(--text)}
.ws{border-left:1px solid var(--border);padding-left:18px} .ws .k b{color:var(--c)}
.foot{margin:40px 0 60px;font-size:13px;color:var(--subtle);line-height:1.6} .foot a{color:var(--brand);text-decoration:none;font-weight:600}
.empty{padding:40px;border:1px dashed var(--border);border-radius:16px;text-align:center;color:var(--muted)}
@media(max-width:820px){.wk,.wk.single{grid-template-columns:52px 1fr}.ws{grid-column:2;border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:12px}.top .meta{display:none}}
@media print{.wk{break-inside:avoid;box-shadow:none} details{display:none}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="wm">Mindvalley <span>×</span> Vishen Lakhiani</div><div class="meta" id="meta"></div></div></div>
<header class="hero"><div class="wrap">
  <h1>Expert &amp; Authority Mastery</h1>
  <p id="intro">The live curriculum. Every lesson, workshop and date below is read from the programme's Airtable, so what you see here is what the team is running.</p>
  <div class="facts" id="facts"></div>
  <div class="legend" id="legend"></div>
  <div class="tz" id="tz"></div>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap foot" id="foot"></footer>
<script id="curriculum" type="application/json">__CURRICULUM_JSON__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('curriculum').textContent);
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var COLORS = ['var(--brand)','var(--orange)','var(--pink)','var(--green)','var(--ink)'];
  var colorOf = function(mod){ var i = D.modules.findIndex(function(m){ return m.name===mod; }); return i<0 ? 'var(--gold)' : COLORS[i%COLORS.length]; };
  var PT = 'America/Los_Angeles', UK = 'Europe/London';
  var local = (Intl.DateTimeFormat().resolvedOptions().timeZone) || null;
  var fmt = function(iso, tz, opts){ return new Intl.DateTimeFormat('en-GB', Object.assign({timeZone: tz}, opts)).format(new Date(iso)); };
  var day = function(iso){ return fmt(iso, PT, {weekday:'short', day:'numeric', month:'short'}); };
  var time = function(iso, tz){ return fmt(iso, tz, {hour:'numeric', minute:'2-digit', hour12:true}).replace(' ', '').toLowerCase(); };
  var zoneShort = function(tz){ try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date()).filter(function(p){return p.type==='timeZoneName';})[0].value; } catch(e){ return tz; } };
  var when = function(s){
    if (!s.start) return '<div class="when"><span>Date to be confirmed</span></div>';
    var parts = [day(s.start), time(s.start, PT) + ' <span>PT</span>', time(s.start, UK) + ' <span>UK</span>'];
    if (local && local!==PT && local!==UK) parts.push(time(s.start, local) + ' <span>' + esc(zoneShort(local)) + '</span>');
    if (s.duration_min) parts.push('<span>' + s.duration_min + ' min</span>');
    return '<div class="when">' + parts.join(' · ') + '</div>';
  };
  // Airtable rich text -> HTML (paragraphs, bold, bullets)
  var md = function(t){
    if (!t) return '';
    var lines = t.replace(/\r/g,'').replace(/^\\-\s?/gm,'- ').split('\n'), out = [], list = [], para = [];
    var flushP = function(){ if (para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
    var flushL = function(){ if (list.length){ out.push('<ul>'+list.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ul>'); list=[]; } };
    var inline = function(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<em>$2</em>'); };
    lines.forEach(function(l){
      var s = l.trim();
      if (!s){ flushP(); flushL(); return; }
      if (/^[-•*]\s+/.test(s)){ flushP(); list.push(s.replace(/^[-•*]\s+/,'')); return; }
      flushL(); para.push(s);
    });
    flushP(); flushL();
    return out.join('');
  };
  var faces = function(sp){ return '<div class="faces">' + sp.map(function(p){ return p.image ? '<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" title="'+esc(p.name)+'" loading="lazy">' : '<i title="'+esc(p.name)+'"></i>'; }).join('') + '</div>'; };
  var names = function(sp){ return sp.map(function(p){ return p.name; }).join(' & '); };
  var col = function(s, label, cls){
    var lead = s.speakers.length ? '<div class="lead">'+faces(s.speakers)+'<span>'+esc(names(s.speakers))+'</span></div>' : '';
    var cover = s.cover ? '<img class="cover" src="'+esc(s.cover)+'" alt="" loading="lazy">' : '';
    var desc = s.description ? '<details><summary>What you’ll learn</summary><div class="desc">'+md(s.description)+'</div></details>' : '';
    return '<div class="col '+cls+'"><div class="k"><b>'+esc(label)+'</b></div>'+when(s)+'<h3>'+esc(s.title.replace(/^Workshop\s*\|\s*/i,''))+'</h3>'+cover+lead+desc+'</div>';
  };
  // group: each Lesson pairs with the Workshop whose title matches "Workshop | <lesson>"
  var S = D.sessions.slice();
  var used = {}, rows = [];
  S.forEach(function(s, i){
    if (used[s.id]) return;
    if (s.type === 'Lesson'){
      var w = S.find(function(x){ return !used[x.id] && x.type==='Workshop' && x.title.replace(/^Workshop\s*\|\s*/i,'').trim().toLowerCase() === s.title.trim().toLowerCase(); });
      used[s.id]=1; if (w) used[w.id]=1;
      rows.push({lesson:s, workshop:w||null, module:s.module});
    } else if (s.type !== 'Workshop'){ used[s.id]=1; rows.push({single:s, module:null}); }
  });
  S.forEach(function(s){ if (!used[s.id]) rows.push({single:s, module:s.module}); }); // orphan workshops
  rows.sort(function(a,b){ var sa=(a.lesson||a.single).start||'9999', sb=(b.lesson||b.single).start||'9999'; return sa<sb?-1:sa>sb?1:0; });

  // hero facts
  var lessons = S.filter(function(s){return s.type==='Lesson';}), live = S.filter(function(s){return s.start;});
  var starts = live.map(function(s){return s.start;}).sort();
  var speakers = {}; S.forEach(function(s){ s.speakers.forEach(function(p){ speakers[p.name]=1; }); });
  var hours = S.reduce(function(a,s){ return a + (s.duration_min||0); }, 0)/60;
  var first = lessons.length ? lessons[0].start : starts[0], last = starts[starts.length-1];
  var longDay = function(iso){ return fmt(iso, PT, {weekday:'long', day:'numeric', month:'long'}); };
  document.getElementById('facts').innerHTML = [
    '<span class="fact"><b>'+lessons.length+'</b> weeks</span>',
    '<span class="fact"><b>'+live.length+'</b> live sessions</span>',
    '<span class="fact"><b>'+Math.round(hours)+'</b> live hours</span>',
    first && last ? '<span class="fact"><b>'+esc(longDay(first))+'</b> to <b>'+esc(longDay(last))+'</b></span>' : '',
    '<span class="fact"><b>'+Object.keys(speakers).length+'</b> teachers</span>'
  ].join('');
  document.getElementById('legend').innerHTML = '<span style="--c:var(--gold)">Bonus &amp; milestones</span>' + D.modules.map(function(m,i){ return '<span style="--c:'+COLORS[i%COLORS.length]+'">'+esc(m.short)+'</span>'; }).join('');
  document.getElementById('tz').innerHTML = 'Times are shown in <b>Pacific</b> and <b>UK</b>' + (local && local!==PT && local!==UK ? ', and in your time zone (<b>'+esc(local.replace(/_/g,' '))+'</b>)' : '') + '. Lessons run about 90 minutes, workshops about 60.';

  // render
  var html = '', curMod = null, wk = 0;
  rows.forEach(function(r){
    if (r.lesson){
      if (r.module !== curMod){ curMod = r.module; var m = D.modules.find(function(x){return x.name===curMod;}) || {name:curMod||'', short:curMod||''}; var n = rows.filter(function(x){return x.lesson && x.module===curMod;}).length; html += '<div class="sec" style="--c:'+colorOf(curMod)+'"><span class="sec-w">'+esc(m.name)+'</span><span class="sec-n">'+n+' week'+(n===1?'':'s')+'</span></div>'; }
      wk++;
      html += '<article class="wk'+(r.workshop?'':' single')+'" style="--c:'+colorOf(r.module)+'"><div class="num"><span>W'+wk+'</span></div>' + col(r.lesson,'Lesson','ls') + (r.workshop ? col(r.workshop,'Workshop','ws') : '') + '</article>';
    } else {
      var s = r.single; var c = s.module ? colorOf(s.module) : 'var(--gold)';
      var tag = s.type==='Kick Off' ? 'Kickoff' : (s.type||'Session');
      html += '<article class="wk single" style="--c:'+c+'"><div class="num"><span>'+esc(tag==='Graduation' ? 'Grad' : tag)+'</span></div>' + col(s, tag, 'ls') + '</article>';
    }
  });
  document.getElementById('main').innerHTML = html || '<div class="empty">No sessions found in Airtable.</div>';

  var synced = new Date(D.synced_at);
  var syncedTxt = new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:UK}).format(synced) + ' UK';
  document.getElementById('meta').innerHTML = (D.mode==='live' ? 'Live from Airtable · synced ' : 'Airtable snapshot · ') + esc(syncedTxt) + ' · built by Gareth Winter';
  document.getElementById('foot').innerHTML = '<p><strong>Source of truth:</strong> <a href="'+esc(D.source.url)+'" target="_blank" rel="noopener">'+esc(D.source.label)+'</a>. ' + (D.mode==='live' ? 'This page re-reads Airtable on every load (cached for ten minutes). Change a title, date, speaker or description there and it appears here.' : 'This copy was taken from Airtable on '+esc(syncedTxt)+'. Set <code>AIRTABLE_TOKEN</code> on the server to read Airtable live on every load.') + '</p><p>Designed by Vishen Lakhiani. Curriculum operations by the Mindvalley Mastery team.</p>';
})();
</script>
</body>
</html>
